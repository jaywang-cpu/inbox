<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12161c">
<link rel="manifest" href="manifest.json">
<title>收件箱</title>
<style>
:root{
  --bg:#12161c; --panel:#1a2029; --panel2:#222b36; --line:#2b3542;
  --fg:#e8edf3; --dim:#8b98a8; --accent:#6fb3c9; --accent2:#c98f6f;
  --ok:#7fbf8f; --warn:#d4a054;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  display:flex;flex-direction:column;overscroll-behavior:none}

header{padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;gap:6px;align-items:center}
header .t{font-size:15px;font-weight:600;letter-spacing:.5px}
header .s{margin-left:auto;font-size:12px;color:var(--dim)}
header .s.on{color:var(--ok)} header .s.off{color:var(--warn)}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.page{flex:1;min-height:0;display:none;flex-direction:column;padding:0 16px}
.page.show{display:flex}

/* 捕获 */
#txt{flex:1;min-height:140px;width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;color:var(--fg);padding:14px;font:inherit;resize:none;outline:none}
#txt:focus{border-color:var(--accent)}
#txt::placeholder{color:#5d6a7a}
.row{display:flex;gap:10px;margin:12px 0}
button{font:inherit;border:none;border-radius:12px;padding:14px;cursor:pointer;color:var(--fg)}
#send{flex:1;background:var(--accent);color:#0d1318;font-weight:600;font-size:17px}
#send:active{opacity:.8}
#send:disabled{background:var(--panel2);color:var(--dim)}
#mic{width:58px;background:var(--panel2);font-size:22px;display:flex;align-items:center;justify-content:center}
#mic.rec{background:#c9556f;animation:pulse 1.1s infinite}
#mic.off{opacity:.35}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.tagbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:7px 14px;font-size:14px;color:var(--dim)}
.tag.on{background:var(--accent2);border-color:var(--accent2);color:#171008;font-weight:600}
.recent{margin-top:4px;overflow-y:auto;max-height:34vh}
.item{background:var(--panel);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.item .m{color:var(--dim);font-size:11px;margin-bottom:3px;display:flex;gap:8px}
.item.pend .m::after{content:"待发送";color:var(--warn)}

/* 日历 */
.cal-h{display:flex;align-items:center;gap:14px;padding:4px 0 12px}
.cal-h b{font-size:18px}
.cal-h button{background:var(--panel);padding:8px 14px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:11px;color:var(--dim);padding:4px 0}
.day{aspect-ratio:1;background:var(--panel);border-radius:9px;padding:4px;
  font-size:12px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day.pad{background:transparent}
.day.today{outline:1.5px solid var(--accent)}
.day .n{color:var(--dim)}
.day.today .n{color:var(--accent);font-weight:700}
.dot{height:4px;border-radius:2px;background:var(--accent2)}
.daylist{margin-top:14px;overflow-y:auto;flex:1}
.daylist h4{margin:0 0 8px;font-size:13px;color:var(--dim);font-weight:500}
.task{background:var(--panel);border-radius:10px;padding:11px 12px;margin-bottom:8px;font-size:15px}
.task .d{font-size:11px;color:var(--accent2);margin-bottom:3px}
.empty{color:var(--dim);font-size:14px;padding:20px 0;text-align:center}

/* 设置 */
label{display:block;font-size:13px;color:var(--dim);margin:16px 0 6px}
input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px;color:var(--fg);font:15px/1.4 ui-monospace,monospace;outline:none}
input:focus{border-color:var(--accent)}
#save{background:var(--panel2);width:100%;margin-top:16px}
.hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
.hint code{background:var(--panel);padding:1px 5px;border-radius:4px}

nav{display:flex;border-top:1px solid var(--line);padding-bottom:var(--safe-b);background:var(--bg)}
nav button{flex:1;background:none;border-radius:0;padding:12px 0 10px;color:var(--dim);font-size:12px}
nav button.on{color:var(--accent)}
nav button .i{display:block;font-size:19px;line-height:1.2}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 74px);
  background:var(--panel2);border:1px solid var(--line);padding:9px 18px;border-radius:22px;
  font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <span class="t">收件箱</span>
  <span class="s" id="status">…</span>
</header>

<main>
  <section class="page show" id="p-cap">
    <textarea id="txt" placeholder="想到什么就写。不用分类。" autofocus></textarea>
    <div class="row" style="margin-bottom:0">
      <div class="tagbar">
        <span class="tag" data-tag="待办">待办</span>
        <span class="tag" data-tag="想法">想法</span>
        <span class="tag" data-tag="情绪">情绪</span>
      </div>
    </div>
    <div class="row"><button id="mic" title="语音">◉</button><button id="send">记下来</button></div>
    <div class="recent" id="recent"></div>
  </section>

  <section class="page" id="p-cal">
    <div class="cal-h">
      <button id="prev">‹</button><b id="mlabel"></b><button id="next">›</button>
    </div>
    <div class="grid" id="wdrow"></div>
    <div class="grid" id="days"></div>
    <div class="daylist" id="daylist"></div>
  </section>

  <section class="page" id="p-set">
    <label>GitHub Token（fine-grained，只给 jay-inbox 写权限）</label>
    <input id="tok" type="password" placeholder="github_pat_..." autocomplete="off">
    <label>仓库</label>
    <input id="repo" placeholder="jaywang-cpu/jay-inbox">
    <button id="save">保存并测试连接</button>
    <div class="hint">
      Token 只存在这台设备的浏览器里，不上传、不写进代码。<br>
      建 token：GitHub → Settings → Developer settings → Fine-grained tokens →
      只勾 <code>jay-inbox</code> 仓库 → Repository permissions → Contents 设为 <code>Read and write</code>。
    </div>
  </section>
</main>

<nav>
  <button class="on" data-p="cap"><span class="i">✎</span>记录</button>
  <button data-p="cal"><span class="i">▦</span>日历</button>
  <button data-p="set"><span class="i">⚙</span>设置</button>
</nav>
<div id="toast"></div>

<script>
const LS = {
  get t(){return localStorage.getItem('tok')||''}, set t(v){localStorage.setItem('tok',v)},
  get r(){return localStorage.getItem('repo')||'jaywang-cpu/jay-inbox'}, set r(v){localStorage.setItem('repo',v)},
  get q(){try{return JSON.parse(localStorage.getItem('queue')||'[]')}catch(e){return[]}},
  set q(v){localStorage.setItem('queue',JSON.stringify(v))}
};
const $ = s => document.querySelector(s);
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('show'),1800); };

/* ---------- 工具 ---------- */
const pad = n => String(n).padStart(2,'0');
const stamp = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const stampT = d => `${stamp(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const b64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));

async function gh(path, opt={}){
  const r = await fetch(`https://api.github.com/repos/${LS.r}/${path}`, {
    ...opt,
    headers:{ Authorization:'Bearer '+LS.t, Accept:'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28', ...(opt.headers||{}) }
  });
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,120));
  return r.json();
}

/* ---------- 捕获 ---------- */
let tag = '';
document.querySelectorAll('.tag').forEach(el => el.onclick = () => {
  const v = el.dataset.tag;
  document.querySelectorAll('.tag').forEach(x=>x.classList.remove('on'));
  if(tag===v){ tag=''; } else { tag=v; el.classList.add('on'); }
});

function render(){
  const q = LS.q;
  $('#recent').innerHTML = q.slice(-12).reverse().map(e =>
    `<div class="item ${e.sent?'':'pend'}"><div class="m"><span>${e.at}</span>${e.tag?`<span>${e.tag}</span>`:''}</div>${
      e.text.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</div>`).join('');
  const pend = q.filter(e=>!e.sent).length;
  const s = $('#status');
  if(!navigator.onLine){ s.className='s off'; s.textContent = pend?`离线 · ${pend} 条待发`:'离线'; }
  else if(pend){ s.className='s off'; s.textContent=`${pend} 条待发`; }
  else { s.className='s on'; s.textContent='已同步'; }
}

$('#send').onclick = async () => {
  const text = $('#txt').value.trim();
  if(!text) return;
  const now = new Date();
  const q = LS.q;
  q.push({ id:now.getTime(), at:stampT(now), iso:now.toISOString(), tag, text, sent:false });
  LS.q = q;
  $('#txt').value = ''; 
  document.querySelectorAll('.tag').forEach(x=>x.classList.remove('on')); tag='';
  render(); toast('已记下');
  $('#txt').focus();
  flush();
};
$('#txt').addEventListener('keydown', e => {
  if((e.metaKey||e.ctrlKey) && e.key==='Enter') $('#send').click();
});

/* ---------- 语音 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $('#mic');
if(!SR){ mic.classList.add('off'); mic.title='本浏览器不支持，用键盘上的话筒键'; }
let rec=null, recing=false;
mic.onclick = () => {
  if(!SR){ $('#txt').focus(); toast('用键盘上的话筒键听写'); return; }
  if(recing){ rec.stop(); return; }
  rec = new SR();
  rec.lang = 'zh-CN'; rec.continuous = true; rec.interimResults = true;
  const base = $('#txt').value;
  rec.onstart = () => { recing=true; mic.classList.add('rec'); };
  rec.onend   = () => { recing=false; mic.classList.remove('rec'); };
  rec.onerror = e => { recing=false; mic.classList.remove('rec'); toast('听写出错：'+e.error); };
  rec.onresult = e => {
    let out='';
    for(let i=0;i<e.results.length;i++) out += e.results[i][0].transcript;
    $('#txt').value = (base ? base+' ' : '') + out;
  };
  try{ rec.start(); }catch(err){ toast('无法启动听写'); }
};

let flushing = false;
async function flush(){
  if(flushing || !navigator.onLine || !LS.t) return;
  flushing = true;
  try{
    const q = LS.q;
    for(const e of q){
      if(e.sent) continue;
      const d = new Date(e.iso);
      const name = `inbox/${stamp(d)}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}_${String(e.id).slice(-4)}.md`;
      const body = `---\ncaptured: ${e.iso}\nsource: phone\ntag: ${e.tag||''}\n---\n\n${e.text}\n`;
      await gh(`contents/${name}`, { method:'PUT',
        body: JSON.stringify({ message:`capture ${e.at}`, content: b64(body) }) });
      e.sent = true; LS.q = q; render();
    }
    // 清掉 3 天前已发送的本地记录
    const cut = Date.now() - 3*864e5;
    LS.q = LS.q.filter(e => !e.sent || e.id > cut);
  }catch(err){ console.error(err); }
  finally{ flushing = false; render(); }
}
addEventListener('online', flush);
setInterval(flush, 30000);

/* ---------- 日历 ---------- */
let cur = new Date(); cur.setDate(1);
let plan = { tasks: [] };
let picked = stamp(new Date());

$('#wdrow').innerHTML = ['一','二','三','四','五','六','日'].map(d=>`<div class="wd">${d}</div>`).join('');

async function loadPlan(){
  if(!LS.t) return;
  try{
    const f = await gh('contents/plan.json');
    plan = JSON.parse(unb64(f.content));
    if(!Array.isArray(plan.tasks)) plan.tasks = [];
    localStorage.setItem('plan', JSON.stringify(plan));
  }catch(e){
    try{ plan = JSON.parse(localStorage.getItem('plan')||'{"tasks":[]}'); }catch(_){}
  }
  drawCal();
}

function drawCal(){
  const y = cur.getFullYear(), m = cur.getMonth();
  $('#mlabel').textContent = `${y} 年 ${m+1} 月`;
  const first = (new Date(y,m,1).getDay() + 6) % 7;   // 周一起
  const len = new Date(y, m+1, 0).getDate();
  const today = stamp(new Date());
  let h = '';
  for(let i=0;i<first;i++) h += '<div class="day pad"></div>';
  for(let d=1;d<=len;d++){
    const key = `${y}-${pad(m+1)}-${pad(d)}`;
    const n = plan.tasks.filter(t=>t.date===key).length;
    h += `<div class="day${key===today?' today':''}" data-d="${key}">
            <span class="n">${d}</span>
            ${n?`<div class="dot"></div>${n>1?`<div class="dot" style="opacity:.5"></div>`:''}`:''}
          </div>`;
  }
  $('#days').innerHTML = h;
  $('#days').querySelectorAll('.day[data-d]').forEach(el =>
    el.onclick = () => { picked = el.dataset.d; drawList(); });
  drawList();
}

function drawList(){
  const ts = plan.tasks.filter(t=>t.date===picked);
  $('#daylist').innerHTML = `<h4>${picked}</h4>` + (ts.length
    ? ts.map(t=>`<div class="task">${t.time?`<div class="d">${t.time}</div>`:''}${t.title}</div>`).join('')
    : `<div class="empty">这天没有计划</div>`);
}
$('#prev').onclick = () => { cur.setMonth(cur.getMonth()-1); drawCal(); };
$('#next').onclick = () => { cur.setMonth(cur.getMonth()+1); drawCal(); };

/* ---------- 设置 ---------- */
$('#tok').value = LS.t; $('#repo').value = LS.r;
$('#save').onclick = async () => {
  LS.t = $('#tok').value.trim(); LS.r = $('#repo').value.trim() || 'jaywang-cpu/jay-inbox';
  try{ await gh(''); toast('连接成功'); flush(); loadPlan(); }
  catch(e){ toast('连接失败：'+String(e.message).slice(0,40)); }
};

/* ---------- 导航 ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));
  b.classList.add('on'); $('#p-'+b.dataset.p).classList.add('show');
  if(b.dataset.p==='cal') loadPlan();
  if(b.dataset.p==='cap') $('#txt').focus();
});

render(); flush(); loadPlan();
if(!LS.t) setTimeout(()=>toast('先到「设置」填 Token'), 600);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>

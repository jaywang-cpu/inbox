<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060c">
<link rel="manifest" href="manifest.json">
<title>星槽</title>
<style>
:root{
  --void:#04060c; --deep:#080d18; --veil:rgba(255,255,255,.045);
  --line:rgba(150,185,225,.14); --fg:#e6edf7; --dim:#7d8da5;
  --star:#a8cbe8; --gold:#d6b072; --ember:#c46b7d; --ok:#79c49a;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--fg);
  font:16px/1.6 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  display:flex;flex-direction:column;overscroll-behavior:none;overflow:hidden}

/* 星空 */
#sky{position:fixed;inset:0;z-index:0;display:block}
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 55% at 50% -10%, rgba(94,126,186,.20), transparent 70%),
    radial-gradient(ellipse 70% 50% at 15% 108%, rgba(150,94,140,.15), transparent 70%),
    radial-gradient(ellipse 60% 40% at 90% 75%, rgba(70,130,140,.10), transparent 70%)}
header,main,nav,#toast{position:relative;z-index:2}

header{padding:calc(var(--st) + 12px) 18px 8px;display:flex;align-items:baseline;gap:10px}
header .t{font-size:15px;font-weight:500;letter-spacing:.22em}
header .s{margin-left:auto;font-size:11px;color:var(--dim);letter-spacing:.08em}
header .s.on{color:var(--ok)} header .s.off{color:var(--gold)}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.page{flex:1;min-width:0;min-height:0;display:none;flex-direction:column;padding:0 18px}
.page>*{min-width:0;max-width:100%}
.page.show{display:flex}
.glass{background:var(--veil);border:1px solid var(--line);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* 捕获 */
#txt{flex:1;min-height:130px;width:100%;color:var(--fg);padding:16px;
  font:17px/1.7 inherit;resize:none;outline:none;background:var(--veil);
  border:1px solid var(--line);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#txt:focus{border-color:rgba(168,203,232,.42);box-shadow:0 0 28px rgba(120,165,220,.13)}
#txt::placeholder{color:#4d5b72}
.row{display:flex;gap:10px;margin:12px 0}
button{font:inherit;border:none;border-radius:14px;padding:14px;cursor:pointer;color:var(--fg)}
#send{flex:1;font-size:16px;letter-spacing:.16em;font-weight:500;
  background:linear-gradient(135deg,rgba(122,166,214,.30),rgba(168,203,232,.14));
  border:1px solid rgba(168,203,232,.34);color:#eaf2fb}
#send:active{opacity:.72}
#mic{width:58px;font-size:20px;background:var(--veil);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--star)}
#mic.rec{background:rgba(196,107,125,.26);border-color:var(--ember);color:#ffd8e0;
  animation:breathe 1.5s ease-in-out infinite}
#mic.off{opacity:.32}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(196,107,125,.4)}50%{box-shadow:0 0 0 11px rgba(196,107,125,0)}}
.tagbar{display:flex;gap:8px;margin-bottom:2px}
.tag{background:var(--veil);border:1px solid var(--line);border-radius:20px;
  padding:6px 15px;font-size:13px;color:var(--dim);letter-spacing:.06em}
.tag.on{background:rgba(214,176,114,.18);border-color:rgba(214,176,114,.5);color:var(--gold)}

.stream{margin-top:6px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.item{border-left:1px solid var(--line);padding:2px 0 14px 15px;position:relative;margin-left:5px}
.item::before{content:"";position:absolute;left:-3.5px;top:8px;width:7px;height:7px;
  border-radius:50%;background:var(--star);box-shadow:0 0 9px var(--star)}
.item.pend::before{background:var(--gold);box-shadow:0 0 9px var(--gold)}
.item .m{color:var(--dim);font-size:11px;letter-spacing:.08em;margin-bottom:2px}
.item .m .p{color:var(--gold)}
.item .b{font-size:14.5px;color:#cfd9e8}

/* 日历 */
.cal-h{display:flex;align-items:center;gap:16px;padding:4px 0 14px}
.cal-h b{font-size:17px;font-weight:500;letter-spacing:.12em}
.cal-h button{background:var(--veil);border:1px solid var(--line);padding:7px 15px;font-size:15px;color:var(--star)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;width:100%}
.wd{text-align:center;font-size:10px;color:var(--dim);padding:3px 0;letter-spacing:.1em}
.day{aspect-ratio:1;min-width:0;background:var(--veil);border:1px solid transparent;border-radius:11px;
  padding:4px;font-size:12px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;position:relative}
.day.pad{background:transparent}
.day.today{border-color:rgba(168,203,232,.5);box-shadow:0 0 16px rgba(120,165,220,.2)}
.day.sel{background:rgba(168,203,232,.16)}
.day .n{color:#9fb0c8}
.day.today .n{color:var(--star)}
.dots{display:flex;gap:3px;height:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
.daylist{margin-top:16px;overflow-y:auto;flex:1}
.daylist h4{margin:0 0 10px;font-size:11px;color:var(--dim);font-weight:400;letter-spacing:.14em}
.task{border-left:1px solid rgba(214,176,114,.4);padding:8px 0 8px 14px;margin-bottom:10px;font-size:15px}
.task .d{font-size:11px;color:var(--gold);letter-spacing:.08em;margin-bottom:2px}
.empty{color:#4d5b72;font-size:13px;padding:26px 0;text-align:center;letter-spacing:.1em}

/* 四象限 */
#p-cal{overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
#p-cal.show{display:block}
#p-cal .daylist{flex:none;overflow:visible;margin-top:18px;min-height:0}
#p-cal .daylist .empty{padding:10px 0}
#p-cal .cal-h{display:flex}
.mx-wrap{margin:26px 0 0;padding-bottom:26px}
.mx-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.mx-h b{font-size:12px;color:var(--dim);font-weight:400;letter-spacing:.18em}
.mx-h .c{font-size:11px;color:var(--gold);letter-spacing:.06em}
.mx-h .r{margin-left:auto;font-size:11px;color:var(--dim);letter-spacing:.1em}
.axis{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr);gap:6px;
  align-items:stretch;width:100%}
.axis .ax{font-size:9.5px;color:#4d5b72;letter-spacing:.2em;text-align:center;min-width:0}
.axis .ax.v{writing-mode:vertical-rl;height:100%;display:flex;align-items:center;justify-content:center}
.axis .sp{grid-column:1}
.qd{min-width:0;background:var(--veil);border:1px solid var(--line);border-radius:13px;padding:10px 10px;
  min-height:118px;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
.qd::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:13px;
  background:radial-gradient(ellipse 120% 90% at 50% 0%,var(--gl),transparent 72%)}
.qd.q1{--gl:rgba(196,107,125,.17);border-color:rgba(196,107,125,.30)}
.qd.q2{--gl:rgba(214,176,114,.15);border-color:rgba(214,176,114,.28)}
.qd.q3{--gl:rgba(168,203,232,.12);border-color:rgba(168,203,232,.22)}
.qd.q4{--gl:rgba(120,140,170,.07)}
.qd .qh{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.14em;position:relative;z-index:1}
.qd.q1 .qh{color:var(--ember)} .qd.q2 .qh{color:var(--gold)}
.qd.q3 .qh{color:var(--star)} .qd.q4 .qh{color:#5a6a80}
.qd .qh .n{margin-left:auto;opacity:.6;letter-spacing:0}
.qd ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;
  position:relative;z-index:1}
.qd li{font-size:12.5px;line-height:1.45;color:#c3cfe0;padding-left:11px;position:relative;
  overflow-wrap:anywhere;word-break:break-word}
.qd li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;
  background:currentColor;opacity:.45}
.qd li .d{font-size:10px;color:var(--dim);letter-spacing:.05em}
.qd li .od{color:var(--ember)}
.qd li .s{font-size:9.5px;color:#4d5b72;border:1px solid var(--line);border-radius:8px;
  padding:0 5px;margin-left:4px}
.qd .qe{font-size:11px;color:#3f4c60;letter-spacing:.1em;position:relative;z-index:1;padding:6px 0}

/* 搜索 */
.sbox{display:flex;gap:9px;padding:2px 0 12px}
#q{flex:1;background:var(--veil);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;color:var(--fg);font:15px inherit;outline:none}
#q:focus{border-color:rgba(168,203,232,.42)}
#q::placeholder{color:#4d5b72}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding-bottom:12px}
.chip{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:16px;padding:5px 12px}
.chip.on{color:var(--star);border-color:rgba(168,203,232,.45);background:rgba(168,203,232,.1)}
.res{overflow-y:auto;flex:1}
.hit{padding:11px 0 11px 15px;border-left:1px solid var(--line);margin-bottom:9px}
.hit .m{font-size:11px;color:var(--dim);letter-spacing:.08em;margin-bottom:3px}
.hit .m .g{color:var(--gold)}
.hit mark{background:rgba(214,176,114,.28);color:#f3e2c4;border-radius:3px;padding:0 2px}

/* 设置 */
label{display:block;font-size:12px;color:var(--dim);margin:18px 0 7px;letter-spacing:.1em}
input.f{width:100%;background:var(--veil);border:1px solid var(--line);border-radius:12px;
  padding:13px;color:var(--fg);font:14px ui-monospace,monospace;outline:none}
input.f:focus{border-color:rgba(168,203,232,.42)}
#save{background:var(--veil);border:1px solid var(--line);width:100%;margin-top:20px;letter-spacing:.14em}
.hint{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.85}
.hint code{color:var(--star);font-size:11.5px}

nav{display:flex;border-top:1px solid var(--line);padding-bottom:var(--sb);
  background:rgba(4,6,12,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
nav button{flex:1;background:none;border-radius:0;padding:11px 0 9px;color:#54637a;
  font-size:10.5px;letter-spacing:.14em}
nav button.on{color:var(--star)}
nav button .i{display:block;font-size:17px;line-height:1.4;margin-bottom:1px}
nav button.on .i{text-shadow:0 0 13px rgba(168,203,232,.75)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 76px);
  background:rgba(12,18,32,.94);border:1px solid var(--line);padding:9px 20px;border-radius:22px;
  font-size:13.5px;letter-spacing:.06em;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
::-webkit-scrollbar{width:0}
@media(prefers-reduced-motion:reduce){#mic.rec{animation:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas><div id="veil"></div>

<header><span class="t">星 槽</span><span class="s" id="status">…</span></header>

<main>
  <section class="page show" id="p-cap">
    <textarea id="txt" placeholder="说出来，或者写下来。不用想归到哪。"></textarea>
    <div class="row" style="margin-bottom:2px">
      <div class="tagbar">
        <span class="tag" data-tag="待办">待办</span>
        <span class="tag" data-tag="想法">想法</span>
        <span class="tag" data-tag="情绪">情绪</span>
      </div>
    </div>
    <div class="row"><button id="mic" title="语音">◉</button><button id="send">收 进 星 槽</button></div>
    <div class="stream" id="stream"></div>
  </section>

  <section class="page" id="p-cal">
    <div class="cal-h"><button id="prev">‹</button><b id="mlabel"></b><button id="next">›</button></div>
    <div class="grid" id="wdrow"></div>
    <div class="grid" id="days"></div>
    <div class="daylist" id="daylist"></div>

    <div class="mx-wrap">
      <div class="mx-h"><b>四 象 限</b><span class="c" id="mxcount"></span>
        <span class="r" id="mxtime"></span></div>
      <div class="axis">
        <div class="sp"></div><div class="ax">紧 急</div><div class="ax">不 紧 急</div>
        <div class="ax v">重 要</div>
        <div class="qd q1" id="q1"></div><div class="qd q2" id="q2"></div>
        <div class="ax v">不重要</div>
        <div class="qd q3" id="q3"></div><div class="qd q4" id="q4"></div>
      </div>
    </div>
  </section>

  <section class="page" id="p-sea">
    <div class="sbox"><input id="q" placeholder="搜任何说过的话" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
    <div class="res" id="res"></div>
  </section>

  <section class="page" id="p-set">
    <label>GITHUB TOKEN</label>
    <input class="f" id="tok" type="password" placeholder="github_pat_..." autocomplete="off">
    <label>数据仓库</label>
    <input class="f" id="repo" placeholder="jaywang-cpu/jay-inbox">
    <button id="save">保 存 并 连 接</button>
    <div class="hint">
      Token 只存在这台设备，不上传、不进代码。<br><br>
      建 token：GitHub → Settings → Developer settings → Fine-grained tokens →
      只勾 <code>jay-inbox</code> → Repository permissions → Contents = <code>Read and write</code>
    </div>
  </section>
</main>

<nav>
  <button class="on" data-p="cap"><span class="i">✦</span>记录</button>
  <button data-p="cal"><span class="i">◈</span>日历</button>
  <button data-p="sea"><span class="i">⌕</span>搜索</button>
  <button data-p="set"><span class="i">◌</span>设置</button>
</nav>
<div id="toast"></div>

<script>
/* ================= 星空 ================= */
(function(){
  const c=document.getElementById('sky'), x=c.getContext('2d');
  let W,H,stars=[],raf=null;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function init(){
    W=c.width=innerWidth*devicePixelRatio; H=c.height=innerHeight*devicePixelRatio;
    c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
    const n=Math.min(190,Math.round(innerWidth*innerHeight/5200));
    stars=Array.from({length:n},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:(Math.random()*1.15+.25)*devicePixelRatio,
      a:Math.random()*.55+.2, sp:Math.random()*.7+.25,
      ph:Math.random()*Math.PI*2, vy:(Math.random()*.05+.012)*devicePixelRatio
    }));
  }
  function draw(t){
    x.clearRect(0,0,W,H);
    for(const s of stars){
      const tw = reduce ? s.a : s.a*(0.55+0.45*Math.sin(t/1000*s.sp+s.ph));
      x.globalAlpha=tw;
      x.fillStyle = s.r>1.5*devicePixelRatio ? '#cfe0f2' : '#9fc0de';
      x.beginPath(); x.arc(s.x,s.y,s.r,0,6.2832); x.fill();
      if(s.r>1.4*devicePixelRatio){
        x.globalAlpha=tw*.18; x.beginPath(); x.arc(s.x,s.y,s.r*3.6,0,6.2832); x.fill();
      }
      if(!reduce){ s.y-=s.vy; if(s.y<-4){ s.y=H+4; s.x=Math.random()*W; } }
    }
    x.globalAlpha=1;
    raf=requestAnimationFrame(draw);
  }
  init(); raf=requestAnimationFrame(draw);
  addEventListener('resize',()=>{init();});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){ cancelAnimationFrame(raf); raf=null; }
    else if(!raf){ raf=requestAnimationFrame(draw); }
  });
})();

/* ================= 基础 ================= */
const LS={
  get t(){return localStorage.getItem('tok')||''}, set t(v){localStorage.setItem('tok',v)},
  get r(){return localStorage.getItem('repo')||'jaywang-cpu/jay-inbox'}, set r(v){localStorage.setItem('repo',v)},
  get q(){try{return JSON.parse(localStorage.getItem('queue')||'[]')}catch(e){return[]}},
  set q(v){localStorage.setItem('queue',JSON.stringify(v))}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1900);};
const pad=n=>String(n).padStart(2,'0');
const stamp=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const stampT=d=>`${stamp(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const b64=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));

async function gh(path,opt={}){
  const r=await fetch(`https://api.github.com/repos/${LS.r}/${path}`,{...opt,
    headers:{Authorization:'Bearer '+LS.t,Accept:'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,110));
  return r.json();
}

/* ================= 捕获 ================= */
let tag='';
document.querySelectorAll('.tag').forEach(el=>el.onclick=()=>{
  const v=el.dataset.tag;
  document.querySelectorAll('.tag').forEach(x=>x.classList.remove('on'));
  tag = (tag===v) ? '' : (el.classList.add('on'), v);
});

function render(){
  const q=LS.q;
  $('#stream').innerHTML=q.slice(-15).reverse().map(e=>
    `<div class="item ${e.sent?'':'pend'}"><div class="m">${e.at}${e.tag?` · ${e.tag}`:''}${
      e.sent?'':' · <span class="p">待发</span>'}</div><div class="b">${esc(e.text)}</div></div>`).join('')
    || `<div class="empty">还没有记录</div>`;
  const pend=q.filter(e=>!e.sent).length, s=$('#status');
  if(!navigator.onLine){s.className='s off';s.textContent=pend?`离线 · ${pend} 待发`:'离线';}
  else if(pend){s.className='s off';s.textContent=`${pend} 待发`;}
  else if(!LS.t){s.className='s off';s.textContent='未连接';}
  else{s.className='s on';s.textContent='已同步';}
}

$('#send').onclick=()=>{
  const text=$('#txt').value.trim(); if(!text) return;
  const now=new Date(), q=LS.q;
  q.push({id:now.getTime(),at:stampT(now),iso:now.toISOString(),tag,text,sent:false});
  LS.q=q; $('#txt').value='';
  document.querySelectorAll('.tag').forEach(x=>x.classList.remove('on')); tag='';
  render(); toast('已收进星槽'); flush();
};
$('#txt').addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter') $('#send').click();
});

/* 语音 */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition, mic=$('#mic');
if(!SR){mic.classList.add('off');mic.title='本浏览器不支持，用键盘话筒键';}
let rec=null,recing=false;
mic.onclick=()=>{
  if(!SR){$('#txt').focus();toast('用键盘上的话筒键听写');return;}
  if(recing){rec.stop();return;}
  rec=new SR(); rec.lang='zh-CN'; rec.continuous=true; rec.interimResults=true;
  const base=$('#txt').value;
  rec.onstart=()=>{recing=true;mic.classList.add('rec');};
  rec.onend=()=>{recing=false;mic.classList.remove('rec');};
  rec.onerror=e=>{recing=false;mic.classList.remove('rec');toast('听写出错 '+e.error);};
  rec.onresult=e=>{let o='';for(let i=0;i<e.results.length;i++)o+=e.results[i][0].transcript;
    $('#txt').value=(base?base+' ':'')+o;};
  try{rec.start();}catch(err){toast('无法启动听写');}
};

/* 发送队列 */
let flushing=false;
async function flush(){
  if(flushing||!navigator.onLine||!LS.t) return;
  flushing=true;
  try{
    const q=LS.q;
    for(const e of q){
      if(e.sent) continue;
      const d=new Date(e.iso);
      const name=`inbox/${stamp(d)}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}_${String(e.id).slice(-4)}.md`;
      await gh(`contents/${name}`,{method:'PUT',body:JSON.stringify({
        message:`capture ${e.at}`,
        content:b64(`---\ncaptured: ${e.iso}\nsource: phone\ntag: ${e.tag||''}\n---\n\n${e.text}\n`)})});
      e.sent=true; LS.q=q; render();
    }
    const cut=Date.now()-3*864e5;
    LS.q=LS.q.filter(e=>!e.sent||e.id>cut);
  }catch(err){console.error(err);}
  finally{flushing=false;render();}
}
addEventListener('online',flush);
setInterval(flush,30000);

/* ================= 日历 ================= */
let cur=new Date(); cur.setDate(1);
let plan={tasks:[]}, picked=stamp(new Date());
$('#wdrow').innerHTML=['一','二','三','四','五','六','日'].map(d=>`<div class="wd">${d}</div>`).join('');

async function loadPlan(){
  try{ if(!LS.t) throw 0;
    plan=JSON.parse(unb64((await gh('contents/plan.json')).content));
    if(!Array.isArray(plan.tasks)) plan.tasks=[];
    localStorage.setItem('plan',JSON.stringify(plan));
  }catch(e){ try{plan=JSON.parse(localStorage.getItem('plan')||'{"tasks":[]}');}catch(_){} }
  drawCal();
}
function drawCal(){
  const y=cur.getFullYear(), m=cur.getMonth();
  $('#mlabel').textContent=`${y} · ${pad(m+1)}`;
  const first=(new Date(y,m,1).getDay()+6)%7, len=new Date(y,m+1,0).getDate(), today=stamp(new Date());
  let h='';
  for(let i=0;i<first;i++) h+='<div class="day pad"></div>';
  for(let d=1;d<=len;d++){
    const key=`${y}-${pad(m+1)}-${pad(d)}`;
    const n=plan.tasks.filter(t=>t.date===key).length;
    h+=`<div class="day${key===today?' today':''}${key===picked?' sel':''}" data-d="${key}">
        <span class="n">${d}</span><div class="dots">${
        '<div class="dot"></div>'.repeat(Math.min(n,3))}</div></div>`;
  }
  $('#days').innerHTML=h;
  $('#days').querySelectorAll('.day[data-d]').forEach(el=>
    el.onclick=()=>{picked=el.dataset.d;drawCal();});
  drawList();
}
function drawList(){
  const ts=plan.tasks.filter(t=>t.date===picked).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  $('#daylist').innerHTML=`<h4>${picked}</h4>`+(ts.length
    ? ts.map(t=>`<div class="task">${t.time?`<div class="d">${t.time}${t.approx?' · 约':''}</div>`:''}${esc(t.title)}</div>`).join('')
    : `<div class="empty">这天没有计划</div>`);
}
/* 四象限 */
let open_={items:[]};
const QN={1:'重要 · 紧急',2:'重要 · 不紧急',3:'不重要 · 紧急',4:'不重要 · 不紧急'};
async function loadOpen(){
  try{ if(!LS.t) throw 0;
    open_=JSON.parse(unb64((await gh('contents/open.json')).content));
    localStorage.setItem('open',JSON.stringify(open_));
  }catch(e){ try{open_=JSON.parse(localStorage.getItem('open')||'{"items":[]}');}catch(_){} }
  drawMatrix();
}
function drawMatrix(){
  const all=open_.items||[];
  $('#mxcount').textContent=all.length?`${all.length} 件没做完`:'';
  $('#mxtime').textContent=open_.updated?open_.updated.slice(5,16).replace('T',' '):'';
  for(const q of [1,2,3,4]){
    const list=all.filter(i=>i.q===q);
    const el=$('#q'+q);
    el.innerHTML=`<div class="qh">${QN[q]}<span class="n">${list.length||''}</span></div>`+
      (list.length
        ? `<ul>${list.map(i=>`<li>${esc(i.title)}${
            i.date?`<span class="d ${i.overdue?'od':''}"> ${i.overdue?'逾期 ':''}${i.date.slice(5)}${
              i.time?' '+i.time:''}${i.approx?' 约':''}</span>`:''}<span class="s">${i.src}</span></li>`).join('')}</ul>`
        : `<div class="qe">空</div>`);
  }
}

$('#prev').onclick=()=>{cur.setMonth(cur.getMonth()-1);drawCal();};
$('#next').onclick=()=>{cur.setMonth(cur.getMonth()+1);drawCal();};

/* ================= 搜索 ================= */
let idx={items:[]}, filt='';
async function loadIndex(){
  try{ if(!LS.t) throw 0;
    idx=JSON.parse(unb64((await gh('contents/index.json')).content));
    localStorage.setItem('idx',JSON.stringify(idx));
  }catch(e){ try{idx=JSON.parse(localStorage.getItem('idx')||'{"items":[]}');}catch(_){} }
  drawChips(); search();
}
function drawChips(){
  const tags=[...new Set(idx.items.map(i=>i.tag).filter(Boolean))];
  $('#chips').innerHTML=['全部',...tags].map(t=>
    `<span class="chip${(filt===''&&t==='全部')||filt===t?' on':''}" data-t="${t==='全部'?'':t}">${t}</span>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filt=c.dataset.t;drawChips();search();});
}
function search(){
  const kw=$('#q').value.trim();
  let list=idx.items.filter(i=>!filt||i.tag===filt);
  if(kw){
    const ks=kw.toLowerCase().split(/\s+/);
    list=list.filter(i=>ks.every(k=>(i.text+i.date+i.tag+i.state).toLowerCase().includes(k)));
  }
  $('#res').innerHTML=list.length
    ? list.slice(0,200).map(i=>{
        let b=esc(i.text);
        if(kw) kw.split(/\s+/).filter(Boolean).forEach(k=>{
          b=b.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);});
        return `<div class="hit"><div class="m">${i.date} ${i.time} · ${i.src}${
          i.tag?` · ${i.tag}`:''}${i.state?` · <span class="g">${esc(i.state)}</span>`:''}</div>${b}</div>`;
      }).join('')
    : `<div class="empty">${kw?'没找到':'输入关键词，或选个标签'}</div>`;
}
let st=null;
$('#q').addEventListener('input',()=>{clearTimeout(st);st=setTimeout(search,140);});

/* ================= 设置 ================= */
$('#tok').value=LS.t; $('#repo').value=LS.r;
$('#save').onclick=async()=>{
  LS.t=$('#tok').value.trim(); LS.r=$('#repo').value.trim()||'jaywang-cpu/jay-inbox';
  try{ await gh(''); toast('连接成功'); flush(); loadPlan(); loadIndex(); }
  catch(e){ toast('连接失败 '+String(e.message).slice(0,32)); }
};

/* ================= 导航 ================= */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));
  b.classList.add('on'); $('#p-'+b.dataset.p).classList.add('show');
  if(b.dataset.p==='cal'){ loadPlan(); loadOpen(); }
  if(b.dataset.p==='sea'){ loadIndex(); $('#q').focus(); }
});

render(); flush(); loadPlan(); loadOpen(); loadIndex();
if(!LS.t) setTimeout(()=>toast('先到「设置」填 Token'),700);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>

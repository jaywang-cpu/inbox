<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060c">
<link rel="manifest" href="manifest.json">
<title>星槽</title>
<style>
:root{
  --void:#04060c; --deep:#080d18; --veil:rgba(255,255,255,.045);
  --line:rgba(150,185,225,.14); --fg:#e6edf7; --dim:#7d8da5;
  --star:#a8cbe8; --gold:#d6b072; --ember:#c46b7d; --ok:#79c49a;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--fg);
  font:16px/1.6 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  display:flex;flex-direction:column;overscroll-behavior:none;overflow:hidden}

/* 星空 */
#sky{position:fixed;inset:0;z-index:0;display:block}
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 55% at 50% -10%, rgba(94,126,186,.20), transparent 70%),
    radial-gradient(ellipse 70% 50% at 15% 108%, rgba(150,94,140,.15), transparent 70%),
    radial-gradient(ellipse 60% 40% at 90% 75%, rgba(70,130,140,.10), transparent 70%)}
header,main,nav,#toast{position:relative;z-index:2}

header{padding:calc(var(--st) + 12px) 18px 8px;display:flex;align-items:baseline;gap:10px}
header .t{font-size:15px;font-weight:500;letter-spacing:.22em}
header .s{margin-left:auto;font-size:11px;color:var(--dim);letter-spacing:.08em}
header .s.on{color:var(--ok)} header .s.off{color:var(--gold)}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.page{flex:1;min-width:0;min-height:0;display:none;flex-direction:column;padding:0 18px}
.page>*{min-width:0;max-width:100%}
.page.show{display:flex}
.glass{background:var(--veil);border:1px solid var(--line);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* 捕获 */
#txt{flex:1;min-height:130px;width:100%;color:var(--fg);padding:16px;
  font:17px/1.7 inherit;resize:none;outline:none;background:var(--veil);
  border:1px solid var(--line);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#txt:focus{border-color:rgba(168,203,232,.42);box-shadow:0 0 28px rgba(120,165,220,.13)}
#txt::placeholder{color:#4d5b72}
.row{display:flex;gap:10px;margin:12px 0}
button{font:inherit;border:none;border-radius:14px;padding:14px;cursor:pointer;color:var(--fg)}
#send{flex:1;font-size:16px;letter-spacing:.16em;font-weight:500;
  background:linear-gradient(135deg,rgba(122,166,214,.30),rgba(168,203,232,.14));
  border:1px solid rgba(168,203,232,.34);color:#eaf2fb}
#send:active{opacity:.72}
#mic{width:58px;font-size:20px;background:var(--veil);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--star)}
#mic.rec{background:rgba(196,107,125,.26);border-color:var(--ember);color:#ffd8e0;
  animation:breathe 1.5s ease-in-out infinite}
#mic.off{opacity:.32}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(196,107,125,.4)}50%{box-shadow:0 0 0 11px rgba(196,107,125,0)}}
.tagbar{display:flex;gap:8px;margin-bottom:2px;align-items:center;flex-wrap:wrap}
#sortnow2{margin-left:auto;background:var(--veil);border:1px solid var(--line);border-radius:20px;
  padding:6px 14px;font-size:11.5px;color:var(--star);letter-spacing:.1em;white-space:nowrap}
#sortnow2:active{opacity:.6}
#sortnow2.busy{color:var(--gold);border-color:rgba(214,176,114,.45)}
.tag{background:var(--veil);border:1px solid var(--line);border-radius:20px;
  padding:6px 15px;font-size:13px;color:var(--dim);letter-spacing:.06em}
.tag.on{background:rgba(214,176,114,.18);border-color:rgba(214,176,114,.5);color:var(--gold)}

.stream{margin-top:6px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.item{border-left:1px solid var(--line);padding:2px 0 14px 15px;position:relative;margin-left:5px}
.item::before{content:"";position:absolute;left:-3.5px;top:8px;width:7px;height:7px;
  border-radius:50%;background:var(--star);box-shadow:0 0 9px var(--star)}
.item.pend::before{background:var(--gold);box-shadow:0 0 9px var(--gold)}
.item .m{color:var(--dim);font-size:11px;letter-spacing:.08em;margin-bottom:2px}
.item .m .p{color:var(--gold)}
.item .b{font-size:14.5px;color:#cfd9e8}

/* 日历 */
.cal-h{display:flex;align-items:center;gap:16px;padding:4px 0 14px}
.cal-h b{font-size:17px;font-weight:500;letter-spacing:.12em}
.cal-h button{background:var(--veil);border:1px solid var(--line);padding:7px 15px;font-size:15px;color:var(--star)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;width:100%}
.wd{text-align:center;font-size:10px;color:var(--dim);padding:3px 0;letter-spacing:.1em}
.day{min-height:clamp(62px,12.5vw,104px);min-width:0;background:var(--veil);border:1px solid transparent;
  border-radius:11px;padding:5px 4px 4px;font-size:12px;display:flex;flex-direction:column;
  align-items:stretch;justify-content:flex-start;gap:3px;position:relative;overflow:hidden}
.ev{font-size:clamp(8.5px,1.9vw,11px);line-height:1.3;background:rgba(214,176,114,.15);
  color:#e0c48c;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:left}
.ev.done{opacity:.35;text-decoration:line-through}
.more{font-size:9px;color:var(--dim);text-align:left;padding-left:4px}
.day.pad{background:transparent}
.day.today{border-color:rgba(168,203,232,.5);box-shadow:0 0 16px rgba(120,165,220,.2)}
.day.sel{background:rgba(168,203,232,.16)}
.day .n{color:#9fb0c8;align-self:flex-start;padding-left:2px;font-size:clamp(11px,2.4vw,14px);line-height:1}
.day.today .n{color:var(--star)}
.dots{display:flex;gap:3px;height:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
.daylist{margin-top:16px;overflow-y:auto;flex:1}
.daylist h4{margin:0 0 10px;font-size:11px;color:var(--dim);font-weight:400;letter-spacing:.14em}
.task{border-left:1px solid rgba(214,176,114,.4);padding:8px 0 8px 14px;margin-bottom:10px;font-size:15px}
.task .d{font-size:11px;color:var(--gold);letter-spacing:.08em;margin-bottom:2px}
.empty{color:#4d5b72;font-size:13px;padding:26px 0;text-align:center;letter-spacing:.1em}
/* 可勾选 */
.ck{flex:0 0 auto;width:20px;height:20px;border:1.5px solid var(--line);border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:transparent;
  transition:all .18s;margin-right:9px}
.ck:active{transform:scale(.85)}
.row-done .ck{background:var(--ok);border-color:var(--ok);color:#0b1a12}
.task{display:flex;align-items:flex-start;gap:0}
.task .tx{flex:1;min-width:0}
.task.row-done .tx{opacity:.4;text-decoration:line-through}
.qd li{display:flex;align-items:flex-start}
.qd li .ck{width:15px;height:15px;font-size:9px;margin-right:7px;margin-top:2px}
.qd li .tx{flex:1;min-width:0}
.qd li.row-done .tx{opacity:.4;text-decoration:line-through}
.qd li::before{display:none}
/* 未来计划 */
.up{margin-top:20px}
.up h4{margin:0 0 10px;font-size:11px;color:var(--dim);font-weight:400;letter-spacing:.14em;
  display:flex;align-items:center;gap:8px}
.up h4::after{content:"";flex:1;height:1px;background:var(--line)}
.upday{font-size:10.5px;color:var(--gold);letter-spacing:.06em;margin:12px 0 5px}
.upday .wk{color:#5a6a80;margin-left:6px}

/* 四象限 */
#p-cal{overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
#p-cal.show{display:block}
#p-cal .daylist{flex:none;overflow:visible;margin-top:18px;min-height:0}
#p-cal .daylist .empty{padding:10px 0}
#p-cal .cal-h{display:flex}
.mx-wrap{margin:26px 0 0;padding-bottom:26px}
.mx-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.mx-h b{font-size:12px;color:var(--dim);font-weight:400;letter-spacing:.18em}
.mx-h .c{font-size:11px;color:var(--gold);letter-spacing:.06em}
.mx-h .r{margin-left:auto;font-size:11px;color:var(--dim);letter-spacing:.1em}
#sortnow{background:var(--veil);border:1px solid var(--line);border-radius:14px;
  padding:6px 13px;font-size:11.5px;color:var(--star);letter-spacing:.1em;white-space:nowrap}
#sortnow:active{opacity:.6}
#sortnow.busy{color:var(--gold);border-color:rgba(214,176,114,.45)}
.mx-h{flex-wrap:wrap;gap:8px}
.axis{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr);gap:6px;
  align-items:stretch;width:100%}
.axis .ax{font-size:9.5px;color:#4d5b72;letter-spacing:.2em;text-align:center;min-width:0}
.axis .ax.v{writing-mode:vertical-rl;height:100%;display:flex;align-items:center;justify-content:center}
.axis .sp{grid-column:1}
.qd{min-width:0;background:var(--veil);border:1px solid var(--line);border-radius:13px;padding:10px 10px;
  min-height:118px;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
.qd::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:13px;
  background:radial-gradient(ellipse 120% 90% at 50% 0%,var(--gl),transparent 72%)}
.qd.q1{--gl:rgba(196,107,125,.17);border-color:rgba(196,107,125,.30)}
.qd.q2{--gl:rgba(214,176,114,.15);border-color:rgba(214,176,114,.28)}
.qd.q3{--gl:rgba(168,203,232,.12);border-color:rgba(168,203,232,.22)}
.qd.q4{--gl:rgba(120,140,170,.07)}
.qd .qh{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.14em;position:relative;z-index:1}
.qd.q1 .qh{color:var(--ember)} .qd.q2 .qh{color:var(--gold)}
.qd.q3 .qh{color:var(--star)} .qd.q4 .qh{color:#5a6a80}
.qd .qh .n{margin-left:auto;opacity:.6;letter-spacing:0}
.qd ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;
  position:relative;z-index:1}
.qd li{font-size:12.5px;line-height:1.45;color:#c3cfe0;padding-left:11px;position:relative;
  overflow-wrap:anywhere;word-break:break-word}
.qd li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;
  background:currentColor;opacity:.45}
.qd li .d,.qd li .due,.qd li .od{font-size:10.5px;letter-spacing:.04em;white-space:nowrap}
.qd li .d{color:var(--dim)}
.qd li .od{color:var(--ember);font-weight:600}
.qd li .due{color:var(--gold)}
.qd li .lf{font-size:9.5px;color:#4d5b72;margin-left:3px}
.task.due{border-left-color:var(--ember)}
.task.due .d{color:var(--ember)}
.task .k{font-size:10px;border:1px solid var(--line);border-radius:8px;padding:0 5px;
  margin-left:6px;color:var(--dim);letter-spacing:.06em}
.qd li .s{font-size:9.5px;color:#4d5b72;border:1px solid var(--line);border-radius:8px;
  padding:0 5px;margin-left:4px}
.qd .qe{font-size:11px;color:#3f4c60;letter-spacing:.1em;position:relative;z-index:1;padding:6px 0}

/* 搜索 */
.sbox{display:flex;gap:9px;padding:2px 0 12px}
#q{flex:1;background:var(--veil);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;color:var(--fg);font:15px inherit;outline:none}
#q:focus{border-color:rgba(168,203,232,.42)}
#q::placeholder{color:#4d5b72}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding-bottom:12px}
.chip{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:16px;padding:5px 12px}
.chip.on{color:var(--star);border-color:rgba(168,203,232,.45);background:rgba(168,203,232,.1)}
.res{overflow-y:auto;flex:1}
.hit{padding:11px 0 11px 15px;border-left:1px solid var(--line);margin-bottom:9px}
.hit .m{font-size:11px;color:var(--dim);letter-spacing:.08em;margin-bottom:3px}
.hit .m .g{color:var(--gold)}
.hit mark{background:rgba(214,176,114,.28);color:#f3e2c4;border-radius:3px;padding:0 2px}

/* 归档：左树右文，仿 Obsidian */
#p-arc.show{display:flex;flex-direction:column;min-height:0}
.arc{display:flex;flex-direction:column;flex:1;min-height:0}
.arc-head{display:flex;align-items:center;gap:10px;padding:2px 0 10px;font-size:11px;
  color:var(--dim);letter-spacing:.12em;min-width:0}
.arc-head .bk{border:1px solid var(--line);border-radius:9px;padding:5px 12px;color:var(--star);
  font-size:12px;letter-spacing:.04em;display:none;white-space:nowrap;flex:0 0 auto}
.arc-head .pth{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.tree{overflow-y:auto;flex:1;padding-bottom:14px}
.tr{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;
  font-size:14px;color:#b9c6d8;user-select:none}
.tr:active{background:var(--veil)}
.tr.sel{background:rgba(168,203,232,.14);color:var(--star)}
.tr .cv{width:12px;text-align:center;font-size:9px;color:#5a6a80;transition:transform .15s}
.tr.open .cv{transform:rotate(90deg)}
.tr .ic{font-size:12px;color:#5a6a80}
.tr.f .ic{color:var(--gold);opacity:.65}
.tr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .ct{margin-left:auto;font-size:10px;color:#4d5b72}

/* 正文 */
.doc{overflow-y:auto;flex:1;padding:4px 2px 40px;display:none}
.doc.on{display:block}
.doc .meta{font-size:11px;color:#4d5b72;letter-spacing:.08em;margin:0 0 14px;
  padding-bottom:10px;border-bottom:1px solid var(--line)}
.doc h1{font-size:25px;font-weight:700;margin:4px 0 18px;letter-spacing:.01em;color:#eef4fb}
.doc h2{font-size:20px;font-weight:700;margin:26px 0 12px;color:#e6eef8}
.doc h3{font-size:16px;font-weight:600;margin:20px 0 9px;color:#dbe5f2}
.doc p{margin:10px 0;font-size:15px;line-height:1.78;color:#c4d0e0}
.doc ul,.doc ol{margin:8px 0;padding-left:20px}
.doc li{font-size:15px;line-height:1.7;color:#c4d0e0;margin:5px 0}
.doc ul li::marker{color:#5f708a}
.doc strong{color:#eef4fb;font-weight:700}
.doc em{color:#cbd7e6;font-style:italic}
.doc a{color:#a693e8;text-decoration:none;border-bottom:1px solid rgba(166,147,232,.35)}
.doc code{background:rgba(255,255,255,.06);border-radius:4px;padding:1px 5px;
  font:13px ui-monospace,monospace;color:var(--star)}
.doc pre{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;overflow-x:auto;margin:12px 0}
.doc pre code{background:none;padding:0;font-size:12.5px;color:#c4d0e0;line-height:1.6}
.doc blockquote{border-left:2px solid #7d6bd0;margin:14px 0;padding:2px 0 2px 14px;color:#aab8cb}
.doc blockquote p{margin:4px 0}
.doc hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.doc table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13.5px;display:block;overflow-x:auto}
.doc th,.doc td{border:1px solid var(--line);padding:7px 10px;text-align:left;color:#c4d0e0}
.doc th{background:rgba(255,255,255,.045);color:#e0e8f4;font-weight:600;white-space:nowrap}
.doc .tk{color:#5f708a;margin-right:6px}
.doc .tk.on{color:var(--ok)}
.doc .dn{opacity:.5;text-decoration:line-through}

@media(min-width:720px){
  #p-arc.show{display:block}
  .arc{display:grid;grid-template-columns:258px minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);gap:0 26px;height:100%;min-height:0}
  .arc-head{grid-column:2;grid-row:1;padding:0 0 10px}
  .tree{grid-column:1;grid-row:1/span 2;border-right:1px solid var(--line);
    padding-right:10px;margin-right:-6px}
  .doc{grid-column:2;grid-row:2;display:block;padding:0 8px 40px 0;min-height:0}
  .doc.off{display:block}
}

/* 设置 */
label{display:block;font-size:12px;color:var(--dim);margin:18px 0 7px;letter-spacing:.1em}
input.f{width:100%;background:var(--veil);border:1px solid var(--line);border-radius:12px;
  padding:13px;color:var(--fg);font:14px ui-monospace,monospace;outline:none}
input.f:focus{border-color:rgba(168,203,232,.42)}
#save{background:var(--veil);border:1px solid var(--line);width:100%;margin-top:20px;letter-spacing:.14em}
.hint{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.85}
.hint code{color:var(--star);font-size:11.5px}

nav{display:flex;border-top:1px solid var(--line);padding-bottom:var(--sb);
  background:rgba(4,6,12,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
nav button{flex:1;background:none;border-radius:0;padding:11px 0 9px;color:#54637a;
  font-size:10.5px;letter-spacing:.14em}
nav button.on{color:var(--star)}
nav button .i{display:block;font-size:17px;line-height:1.4;margin-bottom:1px}
nav button.on .i{text-shadow:0 0 13px rgba(168,203,232,.75)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 76px);
  background:rgba(12,18,32,.94);border:1px solid var(--line);padding:9px 20px;border-radius:22px;
  font-size:13.5px;letter-spacing:.06em;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
::-webkit-scrollbar{width:0}

/* ===== 超窄（小屏手机 / 折叠内屏）===== */
@media(max-width:344px){
  .page{padding:0 12px}
  .axis{grid-template-columns:16px minmax(0,1fr);gap:5px}
  .axis .ax:nth-of-type(1),.axis .ax:nth-of-type(2){display:none}
  .qd .qh{font-size:10px}
  header .t{letter-spacing:.14em}
  nav button{font-size:9.5px;letter-spacing:.08em}
}

/* ===== 平板 ===== */
@media(min-width:600px) and (max-width:719px){
  .page{padding:0 34px}
  #txt{min-height:170px}
  .qd{min-height:140px}
}

/* ===== 电脑 ===== */
@media(min-width:720px){
  body{overflow:auto}
  header,main{width:100%;max-width:1160px;margin:0 auto}
  header{padding:26px 30px 12px}
  header .t{font-size:17px}
  nav{order:-1;border-top:none;border-bottom:1px solid var(--line);padding-bottom:0;
      width:100%;max-width:1160px;margin:0 auto;background:transparent;
      backdrop-filter:none;-webkit-backdrop-filter:none;padding-left:22px}
  nav button{flex:none;padding:13px 20px;font-size:12px;letter-spacing:.16em;
      display:flex;align-items:center;gap:8px;border-bottom:1px solid transparent;margin-bottom:-1px}
  nav button.on{border-bottom-color:var(--star)}
  nav button .i{display:inline;margin:0;font-size:14px;line-height:1}
  .page{padding:0 30px 40px}

  /* 记录：左写右流 */
  #p-cap.show{display:grid;grid-template-columns:minmax(0,1fr) 330px;
      grid-template-rows:1fr auto auto;gap:0 26px;align-content:start;padding-top:14px}
  #p-cap #txt{grid-column:1;grid-row:1;min-height:230px}
  #p-cap .row:nth-of-type(1){grid-column:1;grid-row:2}
  #p-cap .row:nth-of-type(2){grid-column:1;grid-row:3;max-width:420px}
  #p-cap .stream{grid-column:2;grid-row:1/span 3;margin-top:0;max-height:none;
      border-left:1px solid var(--line);padding-left:20px}

  /* 日历：左日历右象限 */
  #p-cal.show{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:0 34px;align-content:start;padding-top:14px}
  #p-cal .cal-h{grid-column:1;grid-row:1}
  #p-cal #wdrow{grid-column:1;grid-row:2}
  #p-cal #days{grid-column:1;grid-row:3}
  #p-cal .daylist{grid-column:1;grid-row:4}
  #p-cal .mx-wrap{grid-column:2;grid-row:1/span 4;margin:0;padding-bottom:0}
  #p-cal .day{font-size:13px;min-height:96px}
  #p-cal .ev{font-size:11px}
  .qd{min-height:150px}

  /* 搜索：结果两列 */
  #p-sea.show{display:flex}
  #p-sea .res{columns:2;column-gap:28px}
  #p-sea .hit{break-inside:avoid}
  #p-sea .sbox,#p-sea .chips{max-width:560px}

  #p-set.show{display:block;max-width:520px;padding-top:14px}
  #toast{bottom:36px}
}

/* ===== 大屏 ===== */
@media(min-width:1300px){
  header,main,nav{max-width:1320px}
  #p-cap.show{grid-template-columns:minmax(0,1fr) 400px}
  #p-sea .res{columns:3}
}
@media(prefers-reduced-motion:reduce){#mic.rec{animation:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas><div id="veil"></div>

<header><span class="t">星 槽</span><span class="s" id="status">…</span></header>

<main>
  <section class="page show" id="p-cap">
    <textarea id="txt" placeholder="说出来，或者写下来。不用想归到哪。"></textarea>
    <div class="row" style="margin-bottom:2px">
      <div class="tagbar">
        <span class="tag" data-tag="待办">待办</span>
        <span class="tag" data-tag="想法">想法</span>
        <span class="tag" data-tag="情绪">情绪</span>
        <button id="sortnow2">立 即 整 理</button>
      </div>
    </div>
    <div class="row"><button id="mic" title="语音">◉</button><button id="send">收 进 星 槽</button></div>
    <div class="stream" id="stream"></div>
  </section>

  <section class="page" id="p-cal">
    <div class="cal-h"><button id="prev">‹</button><b id="mlabel"></b><button id="next">›</button></div>
    <div class="grid" id="wdrow"></div>
    <div class="grid" id="days"></div>
    <div class="daylist" id="daylist"></div>

      <div class="mx-h"><b>四 象 限</b><span class="c" id="mxcount"></span>

        <button id="sortnow">立 即 整 理</button></div>
      <div class="axis">
        <div class="sp"></div><div class="ax">紧 急</div><div class="ax">不 紧 急</div>
        <div class="ax v">重 要</div>
        <div class="qd q1" id="q1"></div><div class="qd q2" id="q2"></div>
        <div class="ax v">不重要</div>
        <div class="qd q3" id="q3"></div><div class="qd q4" id="q4"></div>
      </div>
    </div>
  </section>

  <section class="page" id="p-arc">
    <div class="arc">
      <div class="arc-head"><span class="bk" id="arcback">‹ 返回</span>
        <span class="pth" id="arcpath">归 档</span></div>
      <div class="tree" id="tree"></div>
      <div class="doc" id="doc"></div>
    </div>
  </section>

  <section class="page" id="p-sea">
    <div class="sbox"><input id="q" placeholder="搜任何说过的话" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
    <div class="res" id="res"></div>
  </section>

  <section class="page" id="p-set">
    <label>GITHUB TOKEN</label>
    <div style="display:flex;gap:8px">
      <input class="f" id="tok" type="password" placeholder="github_pat_..." autocomplete="off" style="flex:1">
      <button id="paste" style="background:var(--veil);border:1px solid var(--line);
        padding:13px 16px;white-space:nowrap;font-size:14px;color:var(--star)">粘贴</button>
    </div>
    <label>数据仓库</label>
    <input class="f" id="repo" placeholder="jaywang-cpu/jay-inbox">
    <button id="save">保 存 并 连 接</button>
    <button id="notif" style="background:var(--veil);border:1px solid var(--line);width:100%;
      margin-top:12px;letter-spacing:.14em">开 启 到 点 通 知</button>
    <div class="hint">
      Token 只存在这台设备，不上传、不进代码。<br><br>
      建 token：GitHub → Settings → Developer settings → Fine-grained tokens →
      只勾 <code>jay-inbox</code> → Repository permissions → Contents = <code>Read and write</code>
    </div>
  </section>
</main>

<nav>
  <button class="on" data-p="cap"><span class="i">✦</span>记录</button>
  <button data-p="cal"><span class="i">◈</span>日历</button>
  <button data-p="arc"><span class="i">▤</span>归档</button>
  <button data-p="sea"><span class="i">⌕</span>搜索</button>
  <button data-p="set"><span class="i">◌</span>设置</button>
</nav>
<div id="toast"></div>

<script>
/* ================= 星空 ================= */
(function(){
  const c=document.getElementById('sky'), x=c.getContext('2d');
  let W,H,stars=[],raf=null;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function init(){
    W=c.width=innerWidth*devicePixelRatio; H=c.height=innerHeight*devicePixelRatio;
    c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
    const n=Math.min(190,Math.round(innerWidth*innerHeight/5200));
    stars=Array.from({length:n},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:(Math.random()*1.15+.25)*devicePixelRatio,
      a:Math.random()*.55+.2, sp:Math.random()*.7+.25,
      ph:Math.random()*Math.PI*2, vy:(Math.random()*.05+.012)*devicePixelRatio
    }));
  }
  function draw(t){
    x.clearRect(0,0,W,H);
    for(const s of stars){
      const tw = reduce ? s.a : s.a*(0.55+0.45*Math.sin(t/1000*s.sp+s.ph));
      x.globalAlpha=tw;
      x.fillStyle = s.r>1.5*devicePixelRatio ? '#cfe0f2' : '#9fc0de';
      x.beginPath(); x.arc(s.x,s.y,s.r,0,6.2832); x.fill();
      if(s.r>1.4*devicePixelRatio){
        x.globalAlpha=tw*.18; x.beginPath(); x.arc(s.x,s.y,s.r*3.6,0,6.2832); x.fill();
      }
      if(!reduce){ s.y-=s.vy; if(s.y<-4){ s.y=H+4; s.x=Math.random()*W; } }
    }
    x.globalAlpha=1;
    raf=requestAnimationFrame(draw);
  }
  init(); raf=requestAnimationFrame(draw);
  addEventListener('resize',()=>{init();});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){ cancelAnimationFrame(raf); raf=null; }
    else if(!raf){ raf=requestAnimationFrame(draw); }
  });
})();

/* ====== 扫码导入 token：#t=xxx 落地即存，随后立刻抹掉地址栏 ====== */
(function(){
  const h=location.hash;
  if(h && h.startsWith('#t=')){
    const raw=decodeURIComponent(h.slice(3));
    const [tk,rp]=raw.split('@');
    if(tk){ localStorage.setItem('tok',tk); if(rp) localStorage.setItem('repo',rp); }
    history.replaceState(null,'',location.pathname+location.search);
    sessionStorage.setItem('justImported','1');
  }
})();

/* ================= 基础 ================= */
const LS={
  get t(){return localStorage.getItem('tok')||''}, set t(v){localStorage.setItem('tok',v)},
  get r(){return localStorage.getItem('repo')||'jaywang-cpu/jay-inbox'}, set r(v){localStorage.setItem('repo',v)},
  get q(){try{return JSON.parse(localStorage.getItem('queue')||'[]')}catch(e){return[]}},
  set q(v){localStorage.setItem('queue',JSON.stringify(v))}
};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1900);};
const pad=n=>String(n).padStart(2,'0');
const stamp=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const stampT=d=>`${stamp(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const b64=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));

async function gh(path,opt={}){
  const r=await fetch(`https://api.github.com/repos/${LS.r}/${path}`,{...opt,
    headers:{Authorization:'Bearer '+LS.t,Accept:'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,110));
  return r.json();
}

/* ================= 捕获 ================= */
let tag='';
document.querySelectorAll('.tag').forEach(el=>el.onclick=()=>{
  const v=el.dataset.tag;
  document.querySelectorAll('.tag').forEach(x=>x.classList.remove('on'));
  tag = (tag===v) ? '' : (el.classList.add('on'), v);
});

function render(){
  const q=LS.q;
  $('#stream').innerHTML=q.slice(-15).reverse().map(e=>
    `<div class="item ${e.sent?'':'pend'}"><div class="m">${e.at}${e.tag?` · ${e.tag}`:''}${
      e.sent?'':' · <span class="p">待发</span>'}</div><div class="b">${esc(e.text)}</div></div>`).join('')
    || `<div class="empty">还没有记录</div>`;
  const pend=q.filter(e=>!e.sent).length, s=$('#status');
  if(!navigator.onLine){s.className='s off';s.textContent=pend?`离线 · ${pend} 待发`:'离线';}
  else if(pend){s.className='s off';s.textContent=`${pend} 待发`;}
  else if(!LS.t){s.className='s off';s.textContent='未连接';}
  else{s.className='s on';s.textContent='已同步';}
}

$('#send').onclick=()=>{
  const text=$('#txt').value.trim(); if(!text) return;
  const now=new Date(), q=LS.q;
  q.push({id:now.getTime(),at:stampT(now),iso:now.toISOString(),tag,text,sent:false});
  LS.q=q; $('#txt').value='';
  document.querySelectorAll('.tag').forEach(x=>x.classList.remove('on')); tag='';
  render(); toast('已收进星槽'); flush();
};
$('#txt').addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter') $('#send').click();
});

/* 语音 */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition, mic=$('#mic');
if(!SR){mic.classList.add('off');mic.title='本浏览器不支持，用键盘话筒键';}
let rec=null,recing=false;
mic.onclick=()=>{
  if(!SR){$('#txt').focus();toast('用键盘上的话筒键听写');return;}
  if(recing){rec.stop();return;}
  rec=new SR(); rec.lang='zh-CN'; rec.continuous=true; rec.interimResults=true;
  const base=$('#txt').value;
  rec.onstart=()=>{recing=true;mic.classList.add('rec');};
  rec.onend=()=>{recing=false;mic.classList.remove('rec');};
  rec.onerror=e=>{recing=false;mic.classList.remove('rec');toast('听写出错 '+e.error);};
  rec.onresult=e=>{let o='';for(let i=0;i<e.results.length;i++)o+=e.results[i][0].transcript;
    $('#txt').value=(base?base+' ':'')+o;};
  try{rec.start();}catch(err){toast('无法启动听写');}
};

/* 发送队列 */
let flushing=false;
async function flush(){
  if(flushing||!navigator.onLine||!LS.t) return;
  flushing=true;
  try{
    const q=LS.q;
    for(const e of q){
      if(e.sent) continue;
      const d=new Date(e.iso);
      const name=`inbox/${stamp(d)}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}_${String(e.id).slice(-4)}.md`;
      await gh(`contents/${name}`,{method:'PUT',body:JSON.stringify({
        message:`capture ${e.at}`,
        content:b64(`---\ncaptured: ${e.iso}\nsource: phone\ntag: ${e.tag||''}\n---\n\n${e.text}\n`)})});
      e.sent=true; LS.q=q; render();
    }
    const cut=Date.now()-3*864e5;
    LS.q=LS.q.filter(e=>!e.sent||e.id>cut);
  }catch(err){console.error(err);}
  finally{flushing=false;render();}
}
addEventListener('online',flush);
setInterval(flush,30000);

/* ================= 日历 ================= */
let cur=new Date(); cur.setDate(1);
let plan={tasks:[]}, picked=stamp(new Date());
$('#wdrow').innerHTML=['一','二','三','四','五','六','日'].map(d=>`<div class="wd">${d}</div>`).join('');

async function loadPlan(){
  try{ if(!LS.t) throw 0;
    plan=JSON.parse(unb64((await gh('contents/plan.json')).content));
    if(!Array.isArray(plan.tasks)) plan.tasks=[];
    localStorage.setItem('plan',JSON.stringify(plan));
  }catch(e){ try{plan=JSON.parse(localStorage.getItem('plan')||'{"tasks":[]}');}catch(_){} }
  drawCal();
}
function drawCal(){
  const y=cur.getFullYear(), m=cur.getMonth();
  $('#mlabel').textContent=`${y} · ${pad(m+1)}`;
  const first=(new Date(y,m,1).getDay()+6)%7, len=new Date(y,m+1,0).getDate(), today=stamp(new Date());
  let h='';
  for(let i=0;i<first;i++) h+='<div class="day pad"></div>';
  for(let d=1;d<=len;d++){
    const key=`${y}-${pad(m+1)}-${pad(d)}`;
    const ev=plan.tasks.filter(t=>t.date===key);
    const shown=ev.slice(0,2).map(t=>
      `<div class="ev${t.done?' done':''}">${esc(t.title)}</div>`).join('');
    const rest=ev.length>2?`<div class="more">+${ev.length-2}</div>`:'';
    h+=`<div class="day${key===today?' today':''}${key===picked?' sel':''}" data-d="${key}">
        <span class="n">${d}</span>${shown}${rest}</div>`;
  }
  $('#days').innerHTML=h;
  $('#days').querySelectorAll('.day[data-d]').forEach(el=>
    el.onclick=()=>{picked=el.dataset.d;drawCal();});
  drawList();
}
function drawList(){
  const ts=plan.tasks.filter(t=>t.date===picked).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  $('#daylist').innerHTML=`<h4>${picked}</h4>`+(ts.length
    ? ts.map(t=>{const due=t.kind==='due';
        return `<div class="task${due?' due':''}${t.done?' row-done':''}" data-tid="${esc(t.id||'')}">
          <span class="ck">✓</span><div class="tx">${
          t.time||due?`<div class="d">${due?'截止 ':''}${t.time||'当天'}${t.approx?' · 约':''}</div>`:''}${
          esc(t.title)}${due?'<span class="k">截止</span>':''}</div></div>`;}).join('')
    : `<div class="empty">这天没有计划</div>`) + upcomingHTML();
  bindChecks();
}

/* 未来计划：今天之后所有未完成的，按天分组 */
function upcomingHTML(){
  const today=stamp(new Date());
  const ts=(plan.tasks||[]).filter(t=>!t.done && t.date && t.date>today)
    .sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  if(!ts.length) return '';
  const WK=['日','一','二','三','四','五','六'];
  let h='<div class="up"><h4>接 下 来</h4>', last='';
  for(const t of ts){
    if(t.date!==last){
      last=t.date;
      const d=new Date(t.date+'T12:00:00');
      const days=Math.round((d-new Date(today+'T12:00:00'))/864e5);
      h+=`<div class="upday">${t.date.slice(5)}<span class="wk">周${WK[d.getDay()]} · ${
        days===1?'明天':days===2?'后天':days+'天后'}</span></div>`;
    }
    const due=t.kind==='due';
    h+=`<div class="task${due?' due':''}" data-tid="${esc(t.id||'')}">
      <span class="ck">✓</span><div class="tx">${
      t.time?`<div class="d">${due?'截止 ':''}${t.time}</div>`:''}${esc(t.title)}${
      due?'<span class="k">截止</span>':''}</div></div>`;
  }
  return h+'</div>';
}
/* 四象限 */
let open_={items:[]};
const QN={1:'重要 · 紧急',2:'重要 · 不紧急',3:'不重要 · 紧急',4:'不重要 · 不紧急'};
async function loadOpen(){
  try{ if(!LS.t) throw 0;
    open_=JSON.parse(unb64((await gh('contents/open.json')).content));
    localStorage.setItem('open',JSON.stringify(open_));
  }catch(e){ try{open_=JSON.parse(localStorage.getItem('open')||'{"items":[]}');}catch(_){} }
  drawMatrix();
}
function drawMatrix(){
  const all=open_.items||[];
  $('#mxcount').textContent=all.length?`${all.length} 件没做完`:'';
  $('#mxtime').textContent=open_.updated?open_.updated.slice(5,16).replace('T',' '):'';
  for(const q of [1,2,3,4]){
    const list=all.filter(i=>i.q===q);
    const el=$('#q'+q);
    el.innerHTML=`<div class="qh">${QN[q]}<span class="n">${list.length||''}</span></div>`+
      (list.length
        ? `<ul>${list.map(i=>{
            const due=i.kind==='due', L=i.left;
            let t='';                                   // 时间信息：只留最该看的那个
            if(i.overdue) t=`<span class="od">逾期${Math.abs(L)}天</span>`;
            else if(L===0) t=`<span class="${due?'due':'d'}">今天${i.time?' '+i.time:''}</span>`;
            else if(L!=null&&L<=7) t=`<span class="${due?'due':'d'}">${due?'还剩':'还有'}${L}天${i.time?' '+i.time:''}</span>`;
            else if(i.date) t=`<span class="d">${due?'截止 ':''}${i.date.slice(5)}</span>`;
            const badge=(i.src==='日历')?'':`<span class="s">${i.src}</span>`;
            return `<li data-oid="${esc(i.id||'')}" data-src="${esc(i.src)}" data-file="${
              esc(i.file||'')}" data-title="${esc(i.title)}"><span class="ck">✓</span><div class="tx">${
              esc(i.title)} ${t}${badge}</div></li>`;}).join('')}</ul>`
        : `<div class="qe">空</div>`);
  }
  bindChecks();
}

$('#prev').onclick=()=>{cur.setMonth(cur.getMonth()-1);drawCal();};
$('#next').onclick=()=>{cur.setMonth(cur.getMonth()+1);drawCal();};

/* ================= 归档：文件树 + 正文 ================= */
let vault={files:[]}, openDirs=new Set(['待办','日历','日记','点子','清单','问题','人','备忘','收件箱','life']), curFile=null;

async function loadVault(){
  try{ if(!LS.t) throw 0;
    vault=JSON.parse(unb64((await gh('contents/vault.json')).content));
    localStorage.setItem('vault',JSON.stringify(vault));
  }catch(e){ try{vault=JSON.parse(localStorage.getItem('vault')||'{"files":[]}');}catch(_){} }
  drawTree();
}

function buildTree(files){
  const root={d:{},f:[]};
  for(const f of files){
    const parts=f.p.split('/');
    let n=root;
    for(let i=0;i<parts.length-1;i++){
      n.d[parts[i]]=n.d[parts[i]]||{d:{},f:[]};
      n=n.d[parts[i]];
    }
    n.f.push(f);
  }
  return root;
}
function countAll(n){
  let c=n.f.length;
  for(const k in n.d) c+=countAll(n.d[k]);
  return c;
}
function renderNode(n,prefix,depth){
  let h='';
  for(const k of Object.keys(n.d)){
    const path=prefix?prefix+'/'+k:k;
    const op=openDirs.has(path);
    h+=`<div class="tr d${op?' open':''}" data-dir="${esc(path)}" style="padding-left:${8+depth*13}px">
          <span class="cv">▶</span><span class="ic">▣</span>
          <span class="nm">${esc(k)}</span><span class="ct">${countAll(n.d[k])}</span></div>`;
    if(op) h+=renderNode(n.d[k],path,depth+1);
  }
  for(const f of n.f){
    const nm=f.p.split('/').pop().replace(/\.(md|json)$/,'');
    h+=`<div class="tr f${curFile===f.p?' sel':''}" data-file="${esc(f.p)}" style="padding-left:${8+depth*13}px">
          <span class="cv"></span><span class="ic">▪</span>
          <span class="nm">${esc(nm)}</span></div>`;
  }
  return h;
}
function drawTree(){
  const files=vault.files||[];
  if(!files.length){
    $('#tree').innerHTML=`<div class="empty">还没有内容<br><br>记一条，我整理完就出现在这里</div>`;
    return;
  }
  $('#tree').innerHTML=renderNode(buildTree(files),'',0);
  $('#tree').querySelectorAll('.tr.d').forEach(e=>e.onclick=()=>{
    const p=e.dataset.dir;
    openDirs.has(p)?openDirs.delete(p):openDirs.add(p);
    drawTree();
  });
  $('#tree').querySelectorAll('.tr.f').forEach(e=>e.onclick=()=>openFile(e.dataset.file));
}

function openFile(p){
  const f=(vault.files||[]).find(x=>x.p===p);
  if(!f) return;
  curFile=p;
  $('#doc').innerHTML=md(f.c);
  $('#arcpath').textContent=p.replace(/\.(md|json)$/,'').replace(/\//g,' / ');
  if(innerWidth<720){
    $('#tree').style.display='none';
    $('#doc').classList.add('on');
    $('#arcback').style.display='block';
  }
  $('#doc').scrollTop=0;
  drawTree();
}
$('#arcback').onclick=()=>{
  $('#tree').style.display='';
  $('#doc').classList.remove('on');
  $('#arcback').style.display='none';
  $('#arcpath').textContent='归 档';
  curFile=null; drawTree();
};

/* --- 极简 markdown 渲染 --- */
function inline(t){
  t=esc(t);
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  t=t.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'<a>$2</a>');
  t=t.replace(/\[\[([^\]]+)\]\]/g,'<a>$1</a>');
  t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return t;
}
function md(src){
  let meta='';
  const fm=src.match(/^---\n([\s\S]*?)\n---\n?/);
  if(fm){
    const bits=[];
    for(const l of fm[1].split('\n')){
      const m=l.match(/^\s*([A-Za-z_]+)\s*:\s*(.+)$/);
      if(!m) continue;
      const k=m[1].toLowerCase(), v=m[2].trim();
      if(!v || v==='[]') continue;
      if(k==='source'||k==='url'||k==='link') continue;
      bits.push(v.replace(/^\[|\]$/g,''));
    }
    if(bits.length) meta=`<div class="meta">${esc(bits.join(' · '))}</div>`;
    src=src.slice(fm[0].length);
  }
  return meta+mdBody(src);
}
function mdBody(src){
  if(/^\s*[{[]/.test(src)){                       // json 文件原样显示
    try{ return '<pre><code>'+esc(JSON.stringify(JSON.parse(src),null,2))+'</code></pre>'; }catch(e){}
  }
  const L=src.replace(/\r/g,'').split('\n');
  let h='',i=0,inCode=false,buf=[];
  const flushP=()=>{ if(buf.length){ h+='<p>'+inline(buf.join(' '))+'</p>'; buf=[]; } };
  while(i<L.length){
    let l=L[i];
    if(/^```/.test(l)){
      flushP(); i++; const c=[];
      while(i<L.length && !/^```/.test(L[i])) c.push(L[i++]);
      i++; h+='<pre><code>'+esc(c.join('\n'))+'</code></pre>'; continue;
    }
    if(/^---+\s*$/.test(l)){ flushP(); h+='<hr>'; i++; continue; }
    const hd=l.match(/^(#{1,6})\s+(.*)$/);
    if(hd){ flushP(); const n=Math.min(hd[1].length,3); h+=`<h${n}>${inline(hd[2])}</h${n}>`; i++; continue; }
    if(/^\s*\|/.test(l) && i+1<L.length && /^\s*\|[\s:|-]+\|?\s*$/.test(L[i+1])){
      flushP();
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
      const head=cells(l); i+=2; let body='';
      while(i<L.length && /^\s*\|/.test(L[i])){
        body+='<tr>'+cells(L[i]).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>'; i++;
      }
      h+=`<table><thead><tr>${head.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
      continue;
    }
    if(/^\s*>/.test(l)){
      flushP(); const q=[];
      while(i<L.length && /^\s*>/.test(L[i])) q.push(L[i++].replace(/^\s*>\s?/,''));
      h+='<blockquote>'+mdBody(q.join('\n'))+'</blockquote>'; continue;
    }
    if(/^\s*([-*+]|\d+\.)\s+/.test(l)){
      flushP();
      const ord=/^\s*\d+\./.test(l);
      let items='';
      while(i<L.length && /^\s*([-*+]|\d+\.)\s+/.test(L[i])){
        let t=L[i].replace(/^\s*([-*+]|\d+\.)\s+/,'');
        const cb=t.match(/^\[([ xX])\]\s*(.*)$/);
        if(cb){
          const done=cb[1].toLowerCase()==='x';
          items+=`<li class="${done?'dn':''}"><span class="tk${done?' on':''}">${done?'✓':'○'}</span>${inline(cb[2])}</li>`;
        } else items+='<li>'+inline(t)+'</li>';
        i++;
      }
      h+=(ord?'<ol>':'<ul>')+items+(ord?'</ol>':'</ul>'); continue;
    }
    if(!l.trim()){ flushP(); i++; continue; }
    buf.push(l.trim()); i++;
  }
  flushP();
  return h||'<div class="empty">这个文件是空的</div>';
}

async function doSort(b){

  if(!LS.t) return toast('先到设置连上');

  try{
    await ghPut('trigger.json', {at:new Date().toISOString()}, 'trigger triage');
    toast('已通知电脑，2 分钟内归位');
    // 之后每 30 秒刷一次，归好了自动出现
    let n=0;

      n++; await loadPlan(); await loadOpen(); await loadVault();
      if(n>=8){ clearInterval(iv); b.classList.remove('busy'); b.textContent='立 即 整 理'; }

async function ghPut(path, obj, msg){
  let sha=null;
  try{ sha=(await gh('contents/'+path)).sha; }catch(e){}
  await gh('contents/'+path, {method:'PUT', body:JSON.stringify({
    message:msg, content:b64(JSON.stringify(obj,null,1)), ...(sha?{sha}:{})})});

async function markPlanDone(id){
  const t=(plan.tasks||[]).find(x=>x.id===id);
  if(!t) return;
  t.done=!t.done;
  localStorage.setItem('plan',JSON.stringify(plan));

  catch(e){ toast('没传上去，稍后自动重试'); }
  await loadOpen();
}

async function markTodoDone(file, title, el){
  el.closest('li').classList.add('row-done');
  try{
    let d={marks:[]};
    try{ d=JSON.parse(unb64((await gh('contents/done.json')).content)); }catch(e){}

}

/* ============ 到点通知（页面开着时；手机靠 iPhone 提醒事项） ============ */
function notified(){try{return JSON.parse(localStorage.getItem('notified')||'[]')}catch(e){return[]}}
function markNotified(id){const a=notified();a.push(id);
  localStorage.setItem('notified',JSON.stringify(a.slice(-300)));}

function checkDue(){
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  const now=new Date(), today=stamp(now), hm=pad(now.getHours())+':'+pad(now.getMinutes());
  const done=notified();
  for(const i of (open_.items||[])){
    if(!i.date) continue;
    const due=i.kind==='due';
    // 约会：到点提醒。截止：当天早上 9 点提醒一次 + 逾期提醒一次
    let fire=null,key=null;
    if(i.overdue){ fire='逾期未完成'; key=i.id+'|over|'+today; }
    else if(i.date===today){
      if(i.time && hm>=i.time){ fire=(due?'截止到点 ':'')+i.time; key=i.id+'|t|'+today; }
      else if(!i.time && hm>='09:00'){ fire=due?'今天截止':'今天'; key=i.id+'|d|'+today; }
      else if(due && i.time && hm>='09:00'){ fire='今天 '+i.time+' 截止'; key=i.id+'|m|'+today; }
    }
    if(fire && !done.includes(key)){
      try{ new Notification(i.title,{body:fire+' · '+i.src,icon:'icon-192.png',tag:key}); }catch(e){}
      markNotified(key);
    }
  }
}
setInterval(()=>{ loadOpen().then(checkDue); }, 5*60*1000);

let idx={items:[]}, filt='';
async function loadIndex(){
  try{ if(!LS.t) throw 0;
    idx=JSON.parse(unb64((await gh('contents/index.json')).content));
    localStorage.setItem('idx',JSON.stringify(idx));
  }catch(e){ try{idx=JSON.parse(localStorage.getItem('idx')||'{"items":[]}');}catch(_){} }
  drawChips(); search();
}
function drawChips(){
  const tags=[...new Set(idx.items.map(i=>i.tag).filter(Boolean))];
  $('#chips').innerHTML=['全部',...tags].map(t=>
    `<span class="chip${(filt===''&&t==='全部')||filt===t?' on':''}" data-t="${t==='全部'?'':t}">${t}</span>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filt=c.dataset.t;drawChips();search();});
}
function search(){
  const kw=$('#q').value.trim();
  let list=idx.items.filter(i=>!filt||i.tag===filt);
  if(kw){
    const ks=kw.toLowerCase().split(/\s+/);
    list=list.filter(i=>ks.every(k=>(i.text+i.date+i.tag+i.state).toLowerCase().includes(k)));
  }
  $('#res').innerHTML=list.length
    ? list.slice(0,200).map(i=>{
        let b=esc(i.text);
        if(kw) kw.split(/\s+/).filter(Boolean).forEach(k=>{
          b=b.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);});
        return `<div class="hit"><div class="m">${i.date} ${i.time} · ${i.src}${
          i.tag?` · ${i.tag}`:''}${i.state?` · <span class="g">${esc(i.state)}</span>`:''}</div>${b}</div>`;
      }).join('')
    : `<div class="empty">${kw?'没找到':'输入关键词，或选个标签'}</div>`;
}
let st=null;
$('#q').addEventListener('input',()=>{clearTimeout(st);st=setTimeout(search,140);});
